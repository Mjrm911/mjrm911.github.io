<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكاري | أذكار متحركة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            animation: rotate 40s linear infinite;
        }
        .bg-animation::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.08) 0%, transparent 60%);
            animation: rotate 25s linear infinite reverse;
            top: -25%;
            left: -25%;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .azkar-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 40px 30px;
            margin: 20px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .logo i { font-size: 45px; color: white; }
        .counter-section {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .counter-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 25px;
            border-radius: 50px;
            text-align: center;
        }
        .counter-number {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: block;
        }
        .counter-label { font-size: 0.8rem; color: #94a3b8; }
        .zikr-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50px;
            padding: 40px 25px;
            margin: 20px 0;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.5s ease;
        }
        .current-zikr {
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .zikr-translation {
            color: #94a3b8;
            font-size: 0.9rem;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            padding-top: 15px;
            margin-top: 10px;
        }
        .zikr-benefit {
            color: #38bdf8;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .timer-progress {
            width: 100px;
            height: 4px;
            background: rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        .timer-progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 10px;
            transition: width 1s linear;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        .control-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 24px;
            border-radius: 50px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: scale(1.02);
        }
        .control-btn.primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
        }
        .control-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
        .back-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
        }
        .back-link a {
            color: #38bdf8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .back-link a:hover { gap: 12px; color: #818cf8; }
        .footer {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #475569;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeInUp 0.5s ease forwards; }
        @media (max-width: 600px) {
            .azkar-card { padding: 25px 20px; margin: 15px; }
            .current-zikr { font-size: 1.3rem; }
            .zikr-translation { font-size: 0.8rem; }
            .counter-number { font-size: 1.6rem; }
            .control-btn { padding: 8px 18px; font-size: 0.85rem; }
        }
        
        /* زر MP3 المخصص */
        .mp3-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(56, 189, 248, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 18px;
            border-radius: 50px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mp3-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    
    <div class="azkar-card">
        <div class="logo"><i class="fas fa-mosque"></i></div>
        
        <h1 style="font-size:1.8rem; margin-bottom:10px; background:linear-gradient(135deg,#fff,#94a3b8); -webkit-background-clip:text; background-clip:text; color:transparent;">أذكار اليوم</h1>
        
        <div class="counter-section">
            <div class="counter-box">
                <span class="counter-number" id="zikrCounter">0</span>
                <span class="counter-label">عدد الأذكار</span>
            </div>
            <div class="counter-box">
                <span class="counter-number" id="sessionCounter">0</span>
                <span class="counter-label">الجلسة الحالية</span>
            </div>
        </div>
        
        <div class="zikr-container" id="zikrContainer">
            <div class="current-zikr" id="zikrText">بسم الله الرحمن الرحيم</div>
            <div class="zikr-translation" id="zikrTranslation">البدء بذكر الله</div>
            <div class="zikr-benefit" id="zikrBenefit">فضل الذكر: طمأنينة القلب</div>
        </div>
        
        <div class="timer">
            <i class="fas fa-hourglass-half"></i>
            <span>الذكر القادم بعد</span>
            <span id="timerSeconds">3</span>
            <span>ثواني</span>
            <div class="timer-progress">
                <div class="timer-progress-fill" id="timerProgress"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="prevBtn"><i class="fas fa-arrow-right"></i><span>السابق</span></button>
            <button class="control-btn primary" id="playPauseBtn"><i class="fas fa-pause" id="playPauseIcon"></i><span id="playPauseText">إيقاف مؤقت</span></button>
            <button class="control-btn" id="nextBtn"><span>التالي</span><i class="fas fa-arrow-left"></i></button>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="speedBtn"><i class="fas fa-tachometer-alt"></i><span id="speedText">السرعة: 3 ثواني</span></button>
            <button class="control-btn" id="resetCounterBtn"><i class="fas fa-redo-alt"></i><span>إعادة تعيين العداد</span></button>
        </div>
        
        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-right"></i><span>العودة إلى الصفحة الرئيسية</span><i class="fas fa-home"></i></a>
        </div>
        
        <div class="footer">
            <i class="fas fa-heart" style="color: #ef4444;"></i>
            <span>اللهم اجعلنا من الذاكرين الله كثيراً</span>
        </div>
    </div>

    <!-- زر MP3 في الزاوية -->
    <div class="mp3-btn" id="mp3Btn">
        <i id="mp3Icon" class="fas fa-play"></i>
        <span id="mp3Text">تشغيل</span>
    </div>

    <audio id="mp3Audio" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==================== قوائم الأذكار والأدعية ====================
        const azkarList = [
            { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", translation: "سبحان الله وبحمده", benefit: "فضل: من قالها مائة مرة حطت خطاياه" },
            { text: "سُبْحَانَ اللَّهِ الْعَظِيمِ", translation: "سبحان الله العظيم", benefit: "فضل: كلمتان خفيفتان على اللسان ثقيلتان في الميزان" },
            { text: "لَا إِلَٰهَ إِلَّا اللَّهُ", translation: "لا إله إلا الله", benefit: "فضل: أفضل الذكر" },
            { text: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ", translation: "اللهم صل على محمد وعلى آل محمد", benefit: "فضل: من صلى عليَّ واحدة صلى الله عليه بها عشراً" },
            { text: "أَسْتَغْفِرُ اللَّهَ", translation: "أستغفر الله", benefit: "فضل: من قالها في اليوم مائة مرة غفرت ذنوبه" },
            { text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", translation: "أستغفر الله وأتوب إليه", benefit: "فضل: من لزم الاستغفار جعل الله له من كل هم فرجاً" },
            { text: "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ", translation: "حسبي الله لا إله إلا هو عليه توكلت", benefit: "فضل: من قالها حين يصبح وحين يمسي كفاه الله ما أهمه" },
            { text: "رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا", translation: "رضيت بالله رباً وبالإسلام ديناً وبمحمد نبياً", benefit: "فضل: من قالها حين يمسي كان حقاً على الله أن يرضيه" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ", translation: "اللهم إني أسألك العفو والعافية", benefit: "فضل: دعاء جامع للدنيا والآخرة" },
            { text: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", translation: "لا حول ولا قوة إلا بالله", benefit: "فضل: كنز من كنوز الجنة" },
            { text: "سُبْحَانَ اللَّهِ", translation: "سبحان الله", benefit: "فضل: تسبيح الخلق كله" },
            { text: "الْحَمْدُ لِلَّهِ", translation: "الحمد لله", benefit: "فضل: تملأ الميزان" },
            { text: "اللَّهُ أَكْبَرُ", translation: "الله أكبر", benefit: "فضل: من أحب الكلام إلى الله" },
            { text: "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", translation: "لا إله إلا الله وحده لا شريك له", benefit: "فضل: أفضل ذكر" },
            { text: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ", translation: "سبحان الله والحمد لله ولا إله إلا الله والله أكبر", benefit: "فضل: أحب الكلام إلى الله" },
            { text: "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", translation: "اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال والإكرام", benefit: "فضل: يقال بعد الصلاة" },
            { text: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", translation: "اللهم أعني على ذكرك وشكرك وحسن عبادتك", benefit: "فضل: دعاء النبي صلى الله عليه وسلم" },
            { text: "رَبِّ اغْفِرْ لِي", translation: "رب اغفر لي", benefit: "فضل: من أفضل الاستغفار" },
            { text: "رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", translation: "رب ارحمهما كما ربياني صغيراً", benefit: "فضل: دعاء الوالدين" },
            { text: "رَبِّ زِدْنِي عِلْمًا", translation: "رب زدني علماً", benefit: "فضل: دعاء طلب العلم" },
            { text: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا", translation: "اللهم إني ظلمت نفسي ظلماً كثيراً", benefit: "فضل: دعاء سيد الاستغفار" },
            { text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ", translation: "اللهم إني أعوذ بك من الهم والحزن", benefit: "فضل: دعاء الكرب" },
            { text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ", translation: "اللهم إني أعوذ بك من العجز والكسل", benefit: "فضل: دعاء النشاط" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ", translation: "اللهم إني أسألك الجنة", benefit: "فضل: سؤال الجنة" },
            { text: "اللَّهُمَّ قِنِي عَذَابَ النَّارِ", translation: "اللهم قني عذاب النار", benefit: "فضل: سبع مرات كل يوم" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى", translation: "اللهم إني أسألك الهدى والتقى والعفاف والغنى", benefit: "فضل: دعاء جامع" },
            { text: "اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي", translation: "اللهم أصلح لي ديني الذي هو عصمة أمري", benefit: "فضل: دعاء الصلاح" },
            { text: "اللَّهُمَّ بَارِكْ لِي فِي أَهْلِي وَمَالِي", translation: "اللهم بارك لي في أهلي ومالي", benefit: "فضل: دعاء البركة" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ وَحُبَّ مَنْ يُحِبُّكَ", translation: "اللهم إني أسألك حبك وحب من يحبك", benefit: "فضل: دعاء المحبة" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ", translation: "اللهم إني أسألك الرضا بعد القضاء", benefit: "فضل: دعاء التسليم" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ", translation: "اللهم إني أسألك نعيماً لا ينفد", benefit: "فضل: دعاء الجنة" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ", translation: "اللهم إني أسألك العافية في الدنيا والآخرة", benefit: "فضل: دعاء العافية" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا", translation: "اللهم إني أسألك علماً نافعاً", benefit: "فضل: دعاء العلم النافع" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ رِزْقًا حَلَالًا طَيِّبًا", translation: "اللهم إني أسألك رزقاً حلالاً طيباً", benefit: "فضل: دعاء الرزق" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ صِحَّةً فِي بَدَنِي", translation: "اللهم إني أسألك صحة في بدني", benefit: "فضل: دعاء الصحة" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ قَلْبًا سَلِيمًا", translation: "اللهم إني أسألك قلباً سليماً", benefit: "فضل: دعاء القلب السليم" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ لِسَانًا صَادِقًا", translation: "اللهم إني أسألك لساناً صادقاً", benefit: "فضل: دعاء الصدق" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عَمَلًا مُتَقَبَّلًا", translation: "اللهم إني أسألك عملاً متقبلاً", benefit: "فضل: دعاء القبول" },
