<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأذكار - تفعيل</title>
</head>
<body style="background:#1a1a1a; color:white; text-align:center; padding-top:100px; font-family:sans-serif;">

    <h1>تنشيط نظام الإشعارات (V2)</h1>
    <p>اضغط على الزر بالأسفل لاستخراج كود الجهاز.</p>
    
    <button id="btn" style="padding:20px 40px; background:#28a745; color:white; border:none; border-radius:10px; font-size:18px; cursor:pointer; font-weight:bold;">
        إظهار كود جهازي الآن
    </button>

    <script>
        const publicKey = 'BH_L_97S6S8Xk8G3R0_Wv0_QpG7_Y0_Vp0_X0_Z0_T0_R0_W0_S0_B0_L0_K0_J0';

        document.getElementById('btn').onclick = async () => {
            try {
                // التأكد من دعم المتصفح
                if (!('serviceWorker' in navigator)) {
                    alert("متصفحك لا يدعم هذه الخاصية.");
                    return;
                }

                // تسجيل الخدمة مع إضافة v=2 لتجنب التخزين القديم (Cache)
                const reg = await navigator.serviceWorker.register('sw.js?v=2');
                console.log('Service Worker Registered');

                // انتظار تفعيل الخدمة تماماً
                await navigator.serviceWorker.ready;

                // طلب إذن الإشعارات
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    // الحصول على الاشتراك (Token)
                    const sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: publicKey
                    });
                    
                    // تحويل الكود لنص وعرضه في نافذة منبثقة للنسخ
                    const token = JSON.stringify(sub);
                    prompt("نجح الاتصال! انسخ الكود التالي بالكامل وضعه في الدردشة:", token);
                } else {
                    alert("يجب السماح بالإشعارات لكي يعمل النظام.");
                }
            } catch (error) {
                console.error(error);
                alert("حدث خطأ: " + error.message + "\nجرب تحديث الصفحة أو فتحها في متصفح خفي.");
            }
        };
    </script>
</body>
</html>
