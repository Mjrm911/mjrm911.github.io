<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنشيط نظام الإشعارات</title>
</head>
<body style="background:#121212; color:white; text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>نظام الإرسال المباشر</h2>
    <button id="activate" style="padding:15px 30px; background:#28a745; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer;">اضغط لاستخراج الكود</button>

    <script>
        // هذه الدالة هي الحل لمشكلة الخطأ التي ظهرت لك
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        const publicVapidKey = 'BH_L_97S6S8Xk8G3R0_Wv0_QpG7_Y0_Vp0_X0_Z0_T0_R0_W0_S0_B0_L0_K0_J0';

        document.getElementById('activate').onclick = async () => {
            try {
                const register = await navigator.serviceWorker.register('sw.js?v=final');
                await navigator.serviceWorker.ready;

                const subscription = await register.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                });

                prompt("انسخ هذا الكود بالكامل وأرسله لي لنربطه بالتليجرام:", JSON.stringify(subscription));
            } catch (err) {
                alert("خطأ: " + err.message);
            }
        };
    </script>
</body>
</html>
