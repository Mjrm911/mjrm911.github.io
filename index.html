<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تطبيق الأذكار</title>
</head>
<body style="background:#1a1a1a; color:white; text-align:center; padding-top:100px;">

    <h1>مرحباً بك</h1>
    <p>اضغط الزر بالأسفل للحصول على العنوان:</p>
    
    <button id="btn" style="padding:20px; background:green; color:white; border-radius:10px;">
        أظهر كود جهازي
    </button>

    <script>
        const btn = document.getElementById('btn');
        
        btn.onclick = async () => {
            // تسجيل الخدمة
            const reg = await navigator.serviceWorker.register('sw.js');
            // طلب الإذن
            const permission = await Notification.requestPermission();
            
            if (permission === 'granted') {
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: 'BH_L_97S6S8Xk8G3R0_Wv0_QpG7_Y0_Vp0_X0_Z0_T0_R0_W0_S0_B0_L0_K0_J0'
                });
                // إظهار الكود فوراً في نافذة للنسخ
                prompt("انسخ هذا الكود بالكامل:", JSON.stringify(sub));
            } else {
                alert("يرجى السماح بالإشعارات من إعدادات المتصفح");
            }
        };
    </script>
</body>
</html>
