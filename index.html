<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي الخاص</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        button { padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>مرحباً بك في تطبيقي</h1>
    <p>اضغط الزر بالأسفل لتفعيل الإشعارات واستقبال الرسائل مني:</p>
    <button onclick="subscribe()">تفعيل الإشعارات</button>

    <script>
        // تسجيل المحرك الخفي (Service Worker)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        async function subscribe() {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                const sw = await navigator.serviceWorker.ready;
                const sub = await sw.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: 'BDS_KEY_HERE' // سأخبرك كيف تجيب هذا المفتاح مجاناً
                });
                console.log(JSON.stringify(sub));
                alert("تم الاشتراك بنجاح! أرسل لي الكود الظاهر في الـ Console");
            }
        }
    </script>
</body>
</html>
