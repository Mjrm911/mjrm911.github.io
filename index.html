<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنشيط الإشعارات</title>
</head>
<body style="background:#121212; color:white; text-align:center; font-family:sans-serif; padding-top:50px;">
    <h2>نظام إرسال الأذكار</h2>
    <p>اضغط الزر، وإذا طلب المتصفح إذناً، اختر "سماح".</p>
    <button id="activate" style="padding:15px 30px; background:#28a745; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer;">تفعيل واستخراج الكود</button>

    <script>
        // دالة أساسية لتحويل المفتاح لصيغة رقمية يقبلها المتصفح (تحل مشكلة valid key)
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        const publicVapidKey = 'BH_L_97S6S8Xk8G3R0_Wv0_QpG7_Y0_Vp0_X0_Z0_T0_R0_W0_S0_B0_L0_K0_J0';

        document.getElementById('activate').onclick = async () => {
            if (!('serviceWorker' in navigator)) return alert("متصفحك قديم لا يدعم الإشعارات.");

            try {
                // 1. تسجيل الملف وإجبار التحديث بـ v=final
                const register = await navigator.serviceWorker.register('sw.js?v=final', { scope: '/Azkar/' });
                
                // 2. طلب الإذن
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return alert("لم تقبل إذن الإشعارات!");

                // 3. الاشتراك وتحويل المفتاح
                const subscription = await register.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                });

                // 4. عرض النتيجة النهائية
                const finalCode = JSON.stringify(subscription);
                console.log(finalCode);
                prompt("انسخ هذا الكود بالكامل وأرسله لي:", finalCode);

            } catch (err) {
                console.error(err);
                alert("خطأ: " + err.message);
            }
        };
    </script>
</body>
</html>
