<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق الأذكار</title>
</head>
<body style="background:#1a1a1a; color:white; text-align:center; padding-top:100px; font-family:sans-serif;">
    <h1>تفعيل النظام</h1>
    <button id="btn" style="padding:20px; background:#28a745; color:white; border:none; border-radius:10px;">استخراج كود الإشعارات</button>

    <script>
        document.getElementById('btn').onclick = async () => {
            try {
                // خطوة إضافية: مسح أي تسجيلات قديمة معطلة
                const registrations = await navigator.serviceWorker.getRegistrations();
                for(let registration of registrations) { await registration.unregister(); }

                // تسجيل جديد
                const reg = await navigator.serviceWorker.register('sw.js?v=' + Date.now());
                await navigator.serviceWorker.ready;

                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: 'BH_L_97S6S8Xk8G3R0_Wv0_QpG7_Y0_Vp0_X0_Z0_T0_R0_W0_S0_B0_L0_K0_J0'
                });
                
                prompt("انسخ هذا الكود بالكامل:", JSON.stringify(sub));
            } catch (e) {
                alert("فشل التفعيل. يرجى مسح سجل المتصفح (Cache) للموقع وحاول مجدداً.");
            }
        };
    </script>
</body>
</html>
