<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إرسال إشعارات</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
        }
        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #2d2d2d;
            color: white;
            font-size: 14px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .device {
            background: #2d2d2d;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            word-break: break-all;
            text-align: left;
            font-size: 12px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
        }
        .success { background: #28a74530; border: 1px solid #28a745; }
        .error { background: #dc354530; border: 1px solid #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📤 لوحة تحكم الإشعارات</h2>
        
        <p style="color:#aaa;">📍 <strong>طريقة الإرسال:</strong></p>
        <p style="font-size:14px; background:#2d2d2d; padding:10px; border-radius:8px;">
        1. انسخ الكود (التوكن) من المستخدم<br>
        2. افتح موقع: <strong style="color:#28a745;">https://push.htmg.com</strong><br>
        3. الصق الكود في الخانة المطلوبة<br>
        4. اكتب الرسالة واضغط إرسال
        </p>
        
        <hr style="border-color:#444;">
        
        <h3>📱 الأجهزة المسجلة</h3>
        <div id="devicesList"></div>
        
        <p style="color:#aaa; font-size:12px; margin-top:20px;">
        💡 <strong>ملاحظة:</strong> الأجهزة تحفظ في متصفحك فقط. إذا مسحت بيانات المتصفح، تختفي الأجهزة.
        </p>
    </div>

    <script>
        function loadDevices() {
            const devices = JSON.parse(localStorage.getItem('push_devices') || '[]');
            const container = document.getElementById('devicesList');
            
            if(devices.length === 0) {
                container.innerHTML = '<div class="device" style="text-align:center;">📭 لا توجد أجهزة مسجلة</div>';
                return;
            }
            
            container.innerHTML = devices.map((device, index) => `
                <div class="device">
                    <strong>📱 جهاز ${index + 1}</strong><br>
                    <span style="color:#aaa;">Endpoint:</span> ${device.endpoint.substring(0, 60)}...<br>
                    <button onclick="copyDevice(${index})" style="background:#007bff; padding:5px 10px; font-size:11px; margin-top:8px;">📋 نسخ الكود</button>
                    <button onclick="deleteDevice(${index})" style="background:#dc3545; padding:5px 10px; font-size:11px; margin-top:8px;">🗑 حذف</button>
                </div>
            `).join('');
        }
        
        function copyDevice(index) {
            const devices = JSON.parse(localStorage.getItem('push_devices') || '[]');
            const device = devices[index];
            navigator.clipboard.writeText(JSON.stringify(device));
            alert('✅ تم نسخ كود الجهاز!\nالآن افتح https://push.htmg.com والصق الكود');
        }
        
        function deleteDevice(index) {
            const devices = JSON.parse(localStorage.getItem('push_devices') || '[]');
            devices.splice(index, 1);
            localStorage.setItem('push_devices', JSON.stringify(devices));
            loadDevices();
            alert('✅ تم حذف الجهاز');
        }
        
        function addDevice(subscription) {
            const devices = JSON.parse(localStorage.getItem('push_devices') || '[]');
            devices.push(subscription);
            localStorage.setItem('push_devices', JSON.stringify(devices));
            loadDevices();
        }
        
        // إضافة جهاز من الرابط
        if(window.location.search.includes('add=')) {
            try {
                const sub = JSON.parse(decodeURIComponent(window.location.search.split('add=')[1]));
                addDevice(sub);
                document.body.innerHTML = '<div class="container"><h2>✅ تم تسجيل جهازك بنجاح!</h2><p>يمكنك إغلاق هذه الصفحة.</p></div>';
            } catch(e) {}
        }
        
        loadDevices();
    </script>
</body>
</html>
